<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificação Geral dos Agentes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>🏆 Tabela de Classificação Geral</h1>
      <a href="treino.html" class="btn-voltar">⬅️ Voltar ao Painel</a>
    </header>

    <table>
      <thead>
        <tr>
          <th>Pos.</th>
          <th>criminologo</th>
          <th>Desempenho por Disciplina</th>
          <th>Pontuação Total</th>
          <th>Nível Geral</th>
        </tr>
      </thead>
      <tbody id="tabela-pontuacoes">
        <!-- O JavaScript preencherá os dados automaticamente -->
      </tbody>
    </table>
  </div>

  

  <!-- Liga esta página ao Firebase ANTES do app.js, para que a tabela de
       pontuações receba atualizações em tempo real de QUALQUER dispositivo -->
  <script type="module" src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
